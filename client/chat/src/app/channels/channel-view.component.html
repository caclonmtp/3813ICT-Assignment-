<div style="max-width:800px; margin:1rem auto;">
    <a [routerLink]="['/groups']">← Back to groups</a>
    <h2>{{ group?.name }} / {{ channel?.name }}</h2>
    
    <div style="border:1px solid #ccc; padding:0.75rem; min-height:220px;">
    <div *ngFor="let m of history" style="padding:0.25rem 0; border-bottom:1px dashed #eee;">
    <strong>{{ authorName(m.authorId) }}</strong>
    <small>— {{ m.createdAt | date:'short' }}</small>
    <div>{{ m.text }}</div>
    <button (click)="ban(m.authorId)" *ngIf="session.currentUser()?.roles?.includes('SUPER') || session.currentUser()?.id === group?.creatorId">
    Ban author
    </button>
    </div>
    </div>
    
    <form (submit)="post(); $event.preventDefault();" style="display:flex; gap:0.5rem; margin-top:0.75rem;">
    <input [(ngModel)]="newMessage" name="msg" placeholder="Type message" style="flex:1;" />
    <button type="submit">Send</button>
    </form>
    </div>
