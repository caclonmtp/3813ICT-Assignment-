<div style="max-width:380px; margin:2rem auto; display:grid; gap:0.5rem;">
    <h2>Login</h2>
    <label>Username <input [(ngModel)]="username" /></label>
    <label>Password <input [(ngModel)]="password" type="password" /></label>
    <button (click)="doLogin()">Login</button>
    <button (click)="doRegister()" style="margin-top:0.5rem">Register</button>
    <p style="color:#b00" *ngIf="message">{{ message }}</p>
    <p>Tip: seeded <code>super/123</code>.</p>
  </div>
