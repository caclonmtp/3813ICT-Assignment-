<div class="call-container">
  <header class="call-header">
    <button class="btn-back" (click)="backToChat()">← Back</button>
    <div class="call-info">
      <h2>{{ groupName || 'Call' }}<span *ngIf="channelName"> / #{{ channelName }}</span></h2>
      <span class="call-host" *ngIf="callHost()">Host: {{ callHost() }}</span>
    </div>
    <div class="call-actions">
      <button class="btn-leave" (click)="leaveCall()" [disabled]="isCallLoading() && !inCall()">Leave</button>
    </div>
  </header>

  <div class="call-body">
    <div class="call-error" *ngIf="callError()">
      {{ callError() }}
    </div>

    <div class="call-controls">
      <button
        class="btn-call start"
        *ngIf="!inCall()"
        (click)="startCall()"
        [disabled]="isCallLoading()"
      >
        {{ isCallLoading() ? 'Connecting…' : 'Start Call' }}
      </button>
      <button
        class="btn-call join"
        *ngIf="!inCall() && callActive()"
        (click)="joinCall()"
        [disabled]="isCallLoading()"
      >
        {{ isCallLoading() ? 'Joining…' : 'Join Call' }}
      </button>
      <button class="btn-call share" (click)="toggleScreenShare()" [disabled]="!inCall()">
        {{ isScreenSharing() ? 'Stop Sharing' : 'Share Screen' }}
      </button>
    </div>

    <div class="video-section" *ngIf="inCall()">
      <div class="video-grid">
        <div class="video-tile local">
          <h4>You</h4>
          <video [appMediaStream]="localStream()" muted autoplay playsinline></video>
        </div>
        <div class="video-tile share" *ngIf="isScreenSharing()">
          <h4>Your Screen</h4>
          <video [appMediaStream]="screenStream()" autoplay playsinline></video>
        </div>
        <div class="video-tile" *ngFor="let participant of remoteParticipants()">
          <h4>{{ participant.username }}</h4>
          <video [appMediaStream]="participant.stream" autoplay playsinline></video>
          <div class="video-placeholder" *ngIf="!participant.stream">
            Waiting for video…
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
